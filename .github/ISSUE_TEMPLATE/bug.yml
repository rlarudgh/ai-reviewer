name: "🐛 Bug Report"
description: "프로젝트의 버그를 보고하여 개선에 도움을 주세요."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 보고해주셔서 감사합니다! 정확한 해결을 위해 아래 정보를 최대한 자세히 작성 부탁드립니다.
  - type: textarea
    id: description
    attributes:
      label: "어떤 버그인가요?"
      description: "발생한 문제에 대해 간략히 설명해주세요."
      placeholder: "예: /interview 실행 시 특정 상황에서 응답이 멈춥니다."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "재현 방법"
      description: "문제를 재현하기 위한 단계를 순서대로 작성해주세요."
      placeholder: |
        1. 'claude' 실행
        2. '/interview frontend' 입력
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "기대했던 결과"
      description: "원래 어떤 결과가 나와야 했는지 설명해주세요."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "실행 환경"
      description: "OS, Node.js 버전, Claude CLI 버전 등을 작성해주세요."
      placeholder: "macOS 14.5"
  - type: textarea
    id: screenshots
    attributes:
      label: "스크린샷 (선택)"
      description: "문제 상황을 보여주는 이미지가 있다면 첨부해주세요."