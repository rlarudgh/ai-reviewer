name: "❓ Question / Help"
description: "프로젝트 사용 중 궁금한 점이나 도움이 필요한 사항을 문의하세요."
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        프로젝트에 대해 궁금한 점이 있으신가요? 자유롭게 질문해주세요.
  - type: textarea
    id: question
    attributes:
      label: "질문 내용"
      description: "무엇이 궁금하신가요? 구체적으로 작성해주시면 더 정확한 답변을 드릴 수 있습니다."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "배경 상황 (선택)"
      description: "어떤 상황에서 해당 의문이 생겼는지 설명해주세요."
  - type: checkboxes
    id: check-docs
    attributes:
      label: "문서 확인"
      options:
        - label: "README.md나 CONTRIBUTING.md에서 관련 내용을 찾아보았습니다."
          required: true
